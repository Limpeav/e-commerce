  <script>
    (function () {
      const storedTheme = localStorage.getItem("theme");
      const isDark = storedTheme === "dark";
      const themeColor = isDark ? "#1A1C1B" : "#FCF9F5";
      document.documentElement.classList.toggle("dark", isDark);
      document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      document.querySelector("#theme-color")?.setAttribute("content", themeColor);
      document
        .querySelector("#apple-status-bar-style")
        ?.setAttribute("content", isDark ? "black" : "default");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
