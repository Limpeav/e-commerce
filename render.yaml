services:
  - type: web
    name: ecommerce-backend
    runtime: node
    rootDir: ecommerce-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://cherishbabykhstore.store,https://www.cherishbabykhstore.store,https://baby-products-wtux.onrender.com
      - key: FRONTEND_URL
        value: https://cherishbabykhstore.store
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: ALLOW_LOCAL_DEV_ORIGINS
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: baby_product
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

  - type: web
    name: ecommerce-frontend
    runtime: static
    buildCommand: cd ecommerce-frontend && npm install && npm run build
    staticPublishPath: ecommerce-frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ecommerce-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
