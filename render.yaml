services:
  - type: web
    name: ecommerce-backend
    runtime: node
    rootDir: ecommerce-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: ecommerce-frontend
    runtime: static
    buildCommand: cd ecommerce-frontend && npm install && npm run build
    staticPublishPath: ecommerce-frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ecommerce-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
